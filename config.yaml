    MEX: Mexico City
    BOG: Bogotá
    PTY: Panama City
    LIM: Lima
    SJO: San José (Costa Rica)
    HAV: Havana

# When to send an email.
alerts:
  # Re-alert a destination when its cheapest trip (for both of you) drops by
  # at least this many dollars OR this percent since the last alert for it.
  min_drop_dollars: 40
  min_drop_percent: 5
  # Always send a full summary once per day at this hour (Montreal time),
  # even if nothing changed, so you know it's still running. null = never.
  daily_digest_hour: 9
  top_n: 12                    # trips listed in the "cheapest overall" table

search:
  # When picking each destination's best option, count every hour of travel
  # as this many dollars (for both of you), so a $20-cheaper itinerary with
  # 10 extra hours of airports loses. 0 = pure cheapest.
  hour_cost: 20
  delay_seconds: 1.5           # pause between Google Flights requests
  retries: 2
