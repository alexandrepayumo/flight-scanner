name: Hourly flight scan

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:
    inputs:
      force_email:
        description: "Send an email even if nothing is new"
        type: boolean
        default: false

concurrency:
  group: flight-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      # State (last prices emailed, layovers seen) lives in the Actions cache,
      # so hourly runs don't create hourly commits.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: flight-state-${{ github.run_id }}
          restore-keys: flight-state-

      - name: Scan and email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m scanner.main ${{ inputs.force_email && '--force-email' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: flight-state-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: out/
          retention-days: 3
